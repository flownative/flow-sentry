Flownative:
  Sentry:
    dsn: "%env:SENTRY_DSN%"
    environment: "%env:SENTRY_ENVIRONMENT%"
    release: "%env:SENTRY_RELEASE%"
    sampleRate: 1.0
    tracesSampleRate: 0
    errorLevel: null

    # Additional Sentry SDK client options passed to \Sentry\init(). Options set
    # explicitly by this package (dsn, environment, release, sample rates, error
    # level, exception excludes) always take precedence. The before_send*
    # callbacks, ignore_exceptions and integrations cannot be set here.
    # in_app_exclude entries are merged with the package defaults.
    sdkOptions: {}

    capture:
      excludeExceptionTypes:
        'Neos\Flow\Mvc\Controller\Exception\InvalidControllerException': true
        'Neos\Flow\Mvc\Exception\NoMatchingRouteException': true
        'Neos\Flow\Mvc\Exception\NoSuchActionException': true
        'Neos\Flow\Mvc\Exception\NoSuchControllerException': true
        'Neos\Flow\Property\Exception\TargetNotFoundException': true
      excludeExceptionMessagePatterns: []
      excludeExceptionCodes: []

Neos:
  Flow:
    log:
      psr3:
        Neos\Flow\Log\PsrLoggerFactory:
          systemLogger:
            default:
              class: 'Flownative\Sentry\Log\SentryFileBackend'
      throwables:
        storageClass: 'Flownative\Sentry\Log\SentryStorage'
        optionsByImplementation:
          'Flownative\Sentry\Log\SentryStorage': []
